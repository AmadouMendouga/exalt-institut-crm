name: CRM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/crm_test
      JWT_SECRET: test-secret-only-not-for-deployment
      ADMIN_EMAIL: test@example.com
      ADMIN_PASSWORD: test-password
      AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint && npm run build
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
